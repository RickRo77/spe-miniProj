# Docker's built-in DNS server: re-resolve "calculator" every 5s
resolver 127.0.0.11 valid=5s;

server {
    listen 80;

    # Health endpoint for nginx itself
    location = /nginx-health {
        access_log off;
        return 200 "ok\n";
    }

    location / {
        # Using a variable forces nginx to re-resolve DNS on requests
        set $upstream http://calculator:8080;
        proxy_pass $upstream;

        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    }
}
